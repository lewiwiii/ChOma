name: Build ChOma

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenSSL
        run: |
          brew install openssl@3
          echo "CFLAGS=-I$(brew --prefix openssl@3)/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix openssl@3)/lib -lcrypto -framework CoreFoundation" >> $GITHUB_ENV

      - name: Build for macOS
        run: |
          make CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"

      - name: Clean macOS Build
        run: make clean

      - name: Build for iOS
        run: |
          make TARGET=ios
name: Build ChOma

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenSSL
        run: |
          brew install openssl@3
          echo "CFLAGS=-I$(brew --prefix openssl@3)/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix openssl@3)/lib" >> $GITHUB_ENV

      - name: Build for macOS
        run: |
          make CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"

      - name: Clean macOS Build
        run: make clean

      - name: Build for iOS
        run: |
          make TARGET=ios CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: choma-binaries
          path: |
            libchoma.a
            libchoma.dylib
            choma_cli
            ct_bypass
            dyld_patch
            fat_create
            kpf
