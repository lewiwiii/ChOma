name: Build ChOma

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenSSL
        run: |
          brew install openssl@3

      - name: Patch Makefile Paths
        run: |
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          
          sed -i '' "s|CFLAGS =|CFLAGS = -I$OPENSSL_PREFIX/include |g" Makefile
          sed -i '' "s|LDFLAGS =|LDFLAGS = -L$OPENSSL_PREFIX/lib -lcrypto -framework CoreFoundation |g" Makefile

      - name: Build for macOS
        run: |
          make DISABLE_TESTS=1

      - name: Clean macOS Build
        run: make clean

      - name: Build for iOS
        run: |
          make TARGET=ios DISABLE_TESTS=1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: choma-binaries
          path: output/
