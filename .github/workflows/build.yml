name: Build ChOma

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OpenSSL
        run: |
          brew install openssl@3

      - name: Auto-Discover and Patch Function Signatures
        run: |
          FOUND_FUNC="macho_add_code_directory_blob"
          if grep -q "csd_update_code_directory" include/choma/*.h 2>/dev/null; then
            FOUND_FUNC="csd_update_code_directory"
          elif grep -q "update_code_directory" include/choma/*.h 2>/dev/null; then
            FOUND_FUNC="update_code_directory"
          elif grep -q "csd_code_directory_update" include/choma/*.h 2>/dev/null; then
            FOUND_FUNC="csd_code_directory_update"
          fi
          
          find tests -type f -name "*.c" -exec sed -i '' "s/csd_code_directory_update/ $FOUND_FUNC /g" {} + || true
          find tests -type f -name "*.c" -exec sed -i '' "s/csd_update_code_directory/ $FOUND_FUNC /g" {} + || true
          find tests -type f -name "*.c" -exec sed -i '' "s/update_code_directory/ $FOUND_FUNC /g" {} + || true
          find tests -type f -name "*.c" -exec sed -i '' "s/macho_add_code_directory_blob/ $FOUND_FUNC /g" {} + || true

      - name: Generate Complete Makefile
        run: |
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          
          cat << 'EOF' > Makefile
          CC = clang
          CFLAGS = -Wall -Werror -fPIC -Wno-pointer-to-int-cast -Wno-unused-command-line-argument -Wno-deprecated-declarations -Iinclude
          TEST_CFLAGS = -Wall -fPIC -Wno-pointer-to-int-cast -Wno-unused-command-line-argument -Wno-deprecated-declarations -Wno-unreachable-code -Iinclude
          LDFLAGS = -framework CoreFoundation
          
          ifeq ($(TARGET),ios)
              CFLAGS += -arch arm64 -arch arm64e -isysroot /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk -miphoneos-version-min=11.0
              TEST_CFLAGS += -arch arm64 -arch arm64e -isysroot /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk -miphoneos-version-min=11.0
              TEST_LDFLAGS = -arch arm64 -arch arm64e -isysroot /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk -miphoneos-version-min=11.0 external/ios/libcrypto.a -framework CoreFoundation
              LDFLAGS += -arch arm64 -arch arm64e -isysroot /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk -miphoneos-version-min=11.0 external/ios/libcrypto.a
              OBJ_DIR = build/ios
              OUT_DIR = output/ios
          else
              CFLAGS += -I$(OPENSSL_PREFIX)/include -mmacosx-version-min=10.13
              TEST_CFLAGS += -I$(OPENSSL_PREFIX)/include -mmacosx-version-min=10.13
              TEST_LDFLAGS = -L$(OPENSSL_PREFIX)/lib -lcrypto -framework CoreFoundation
              LDFLAGS += -L$(OPENSSL_PREFIX)/lib -lcrypto -mmacosx-version-min=10.13
              OBJ_DIR = build
              OUT_DIR = output
          endif

          SRCS = $(wildcard src/*.c)
          OBJS = $(patsubst src/%.c, $(OBJ_DIR)/%.o, $(SRCS))

          TEST_NAMES = choma_cli ct_bypass dyld_patch fat_create kpf choma_sign
          TEST_BINS = $(patsubst %, $(OUT_DIR)/tests/%, $(TEST_NAMES))

          all: $(OUT_DIR)/lib/libchoma.a $(OUT_DIR)/lib/libchoma.dylib build_tests

          build_tests: $(OUT_DIR)/lib/libchoma.a
          	@mkdir -p $(OUT_DIR)/tests
          	@for test in $(TEST_NAMES); do \
          		echo "Building test tool: $$test"; \
          		SOURCES=$$(ls tests/$$test/*.c 2>/dev/null || true); \
          		if [ ! -z "$$SOURCES" ]; then \
          			$(CC) $(TEST_CFLAGS) $(TEST_LDFLAGS) -Ioutput/include -Iinclude $$SOURCES $(OUT_DIR)/lib/libchoma.a -o $(OUT_DIR)/tests/$$test; \
          		fi; \
          	done

          $(OBJ_DIR)/%.o: src/%.c
          	@mkdir -p $(@D)
          	$(CC) $(CFLAGS) -c $< -o $@

          $(OUT_DIR)/lib/libchoma.a: $(OBJS)
          	@mkdir -p $(@D)
          	libtool $(OBJS) -o $@

          $(OUT_DIR)/lib/libchoma.dylib: $(OBJS)
          	@mkdir -p $(@D)
          	$(CC) $(CFLAGS) $(LDFLAGS) -shared -o $@ $(OBJS)

          clean:
          	rm -rf build output
          EOF
          
          sed -i '' "s|\$(OPENSSL_PREFIX)|$OPENSSL_PREFIX|g" Makefile

      - name: Build for macOS
        run: |
          make

      - name: Verify macOS Packages
        run: |
          echo "=== Built macOS Binaries ==="
          ls -la output/tests/

      - name: Backup macOS Binaries
        run: |
          mkdir -p macos-binaries
          cp -r output/lib macos-binaries/ || true
          cp -r output/tests macos-binaries/ || true

      - name: Clean Workspace Objects
        run: |
          make clean

      - name: Build for iOS
        run: |
          make TARGET=ios

      - name: Verify iOS Packages
        run: |
          echo "=== Built iOS Binaries ==="
          ls -la output/ios/tests/

      - name: Backup iOS Binaries
        run: |
          mkdir -p ios-binaries
          cp -r output/ios/lib ios-binaries/ || true
          cp -r output/ios/tests ios-binaries/ || true

      - name: Package Architecture Zips
        run: |
          mkdir -p release-artifacts
          
          cd macos-binaries
          zip -r ../release-artifacts/choma-macos.zip .
          cd ..
          
          cd ios-binaries
          zip -r ../release-artifacts/choma-ios.zip .
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: choma-all-packages
          path: release-artifacts/

      - name: Deploy GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/choma-macos.zip
            release-artifacts/choma-ios.zip
          draft: false
          prerelease: false
